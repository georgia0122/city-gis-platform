<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能出行规划 - City GIS Weather Decision Platform</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/static/css/style.css" />
    <style>
        .planning-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .planning-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eee;
        }

        .planning-header h1 {
            font-size: 32px;
            color: #333;
            margin-bottom: 10px;
        }

        .planning-header p {
            font-size: 16px;
            color: #666;
        }

        .form-section {
            background: white;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .form-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #4285f4;
            box-shadow: 0 0 0 3px rgba(66, 133, 244, 0.1);
        }

        .transport-modes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
        }

        .transport-mode-btn {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            text-align: center;
        }

        .transport-mode-btn:hover {
            border-color: #4285f4;
            background: #f0f4ff;
        }

        .transport-mode-btn.selected {
            background: #4285f4;
            color: white;
            border-color: #4285f4;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4285f4 0%, #34a853 100%);
            color: white;
            padding: 14px 32px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            box-shadow: 0 2px 8px rgba(66, 133, 244, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(66, 133, 244, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .results-container {
            display: none;
        }

        .result-card {
            background: white;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .result-header .icon {
            font-size: 48px;
        }

        .result-header .info h2 {
            font-size: 24px;
            color: #333;
            margin: 0 0 5px 0;
        }

        .result-header .info p {
            font-size: 14px;
            color: #666;
            margin: 0;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-left: auto;
        }

        .status-go {
            background: #d4edda;
            color: #155724;
        }

        .status-caution {
            background: #fff3cd;
            color: #856404;
        }

        .status-avoid {
            background: #f8d7da;
            color: #721c24;
        }

        .modes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .mode-card {
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s;
        }

        .mode-card.recommended {
            border: 2px solid #4285f4;
            background: #f0f4ff;
            box-shadow: 0 2px 8px rgba(66, 133, 244, 0.2);
        }

        .mode-card .icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .mode-card .name {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .mode-card .status {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 8px;
        }

        .mode-card .reason {
            font-size: 12px;
            color: #666;
            line-height: 1.4;
        }

        .routes-section,
        .weather-section,
        .traffic-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #f0f0f0;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .route-item {
            border-left: 4px solid #4285f4;
            padding: 15px;
            margin-bottom: 12px;
            background: #f9f9f9;
            border-radius: 4px;
        }

        .route-item .route-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .route-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            font-size: 13px;
            color: #666;
        }

        .route-info-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .route-description {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }

        .risk-item {
            padding: 12px;
            margin-bottom: 10px;
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            border-radius: 4px;
            font-size: 13px;
        }

        .traffic-item {
            padding: 12px;
            margin-bottom: 10px;
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            border-radius: 4px;
            font-size: 13px;
        }

        .suggestion-list {
            list-style: none;
            padding: 0;
        }

        .suggestion-list li {
            padding: 12px;
            margin-bottom: 10px;
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            border-radius: 4px;
            font-size: 13px;
        }

        .confidence-bar {
            margin-top: 10px;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #34a853 0%, #4285f4 100%);
            transition: width 0.3s;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #f5c6cb;
            margin-bottom: 20px;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4285f4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .topbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px 30px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .topbar .brand {
            font-size: 24px;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .topbar-nav {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .topbar-nav a {
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            transition: background 0.3s;
        }

        .topbar-nav a:hover {
            background: rgba(255,255,255,0.3);
        }

        .topbar-nav a.active {
            background: rgba(255,255,255,0.4);
            font-weight: 600;
        }
    </style>
</head>
<body>
    <!-- 顶部导航栏 -->
    <div class="topbar">
        <div class="brand">🌍 GeoWeather</div>
        <div class="topbar-nav">
            <a href="/">🏠 地图</a>
            <a href="/alerts">🚨 预警</a>
            <a href="/travel-planning" class="active">🚗 出行规划</a>
            <a href="/profile">👤 个人中心</a>
            <a href="/logout">🚪 退出</a>
        </div>
    </div>

    <div class="planning-container">
        <!-- 页面标题 -->
        <div class="planning-header">
            <h1>🚗 智能出行规划助手</h1>
            <p>基于实时天气数据，为您规划最优的出行方案，包括推荐方式、路线、时间和路况预测</p>
        </div>

        <!-- 出行规划表单 -->
        <div class="form-section">
            <div class="form-title">📍 出行信息</div>
            <div class="form-grid">
                <div class="form-group">
                    <label for="origin">出发地点 *</label>
                    <input type="text" id="origin" placeholder="例如：天津和平广场" required>
                </div>
                <div class="form-group">
                    <label for="destination">目的地 *</label>
                    <input type="text" id="destination" placeholder="例如：天津滨河公园" required>
                </div>
                <div class="form-group">
                    <label for="distance">距离（公里）</label>
                    <input type="number" id="distance" placeholder="例如：10" min="0" step="0.1">
                </div>
                <div class="form-group">
                    <label for="expected-duration">预期时长（分钟）</label>
                    <input type="number" id="expected-duration" placeholder="例如：30" min="0" step="5">
                </div>
            </div>

            <div class="form-title" style="margin-top: 25px;">⏰ 时间信息</div>
            <div class="form-grid">
                <div class="form-group">
                    <label for="preferred-time">偏好出发时间</label>
                    <input type="time" id="preferred-time">
                </div>
                <div class="form-group">
                    <label for="location">所在城市/地点 *</label>
                    <select id="location" required>
                        <option value="">-- 请选择 --</option>
                        <option value="p1" data-lat="39.0851" data-lng="117.1994" data-city="天津">天津市区</option>
                        <option value="p4" data-lat="39.9042" data-lng="116.4074" data-city="北京">北京市区</option>
                        <option value="p5" data-lat="31.2304" data-lng="121.4737" data-city="上海">上海市区</option>
                        <option value="p6" data-lat="23.1291" data-lng="113.2644" data-city="广州">广州市区</option>
                        <option value="p7" data-lat="22.5431" data-lng="114.0579" data-city="深圳">深圳市区</option>
                        <option value="p8" data-lat="30.5728" data-lng="104.0668" data-city="成都">成都市区</option>
                        <option value="p9" data-lat="30.2741" data-lng="120.1551" data-city="杭州">杭州市区</option>
                        <option value="p10" data-lat="32.0603" data-lng="118.7969" data-city="南京">南京市区</option>
                    </select>
                </div>
            </div>

            <div class="form-title" style="margin-top: 25px;">🚌 出行方式偏好</div>
            <div class="transport-modes">
                <button type="button" class="transport-mode-btn" data-mode="subway">
                    🚇 地铁
                </button>
                <button type="button" class="transport-mode-btn" data-mode="bus">
                    🚌 公交
                </button>
                <button type="button" class="transport-mode-btn" data-mode="driving">
                    🚗 自驾
                </button>
                <button type="button" class="transport-mode-btn" data-mode="walking">
                    🚶 步行
                </button>
                <button type="button" class="transport-mode-btn" data-mode="cycling">
                    🚲 骑车
                </button>
            </div>

            <button type="button" class="btn-primary" id="planBtn" style="margin-top: 25px;">
                🔍 规划出行方案
            </button>
        </div>

        <!-- 规划结果 -->
        <div class="results-container" id="resultsContainer">
            <div id="errorMessage" class="error-message" style="display: none;"></div>

            <!-- 主要推荐方案 -->
            <div class="result-card" id="primaryRecommendation">
                <div class="result-header">
                    <div class="icon">🚗</div>
                    <div class="info">
                        <h2 id="primaryModeDisplay">地铁</h2>
                        <p id="primaryModeDesc">最优出行方案</p>
                    </div>
                    <div class="status-badge" id="primaryStatus">推荐</div>
                </div>
            </div>

            <!-- 各出行方式评级 -->
            <div class="result-card" id="modesRating">
                <div class="section-title">📊 各出行方式评级</div>
                <div class="modes-grid" id="modesGrid"></div>
            </div>

            <!-- 推荐路线 -->
            <div class="result-card routes-section" id="routesSection">
                <div class="section-title">🗺️ 推荐路线</div>
                <div id="routesList"></div>
            </div>

            <!-- 出行时间建议 -->
            <div class="result-card">
                <div class="section-title">⏰ 出行时间建议</div>
                <div style="padding: 15px; background: #f0f4ff; border-radius: 6px;">
                    <div style="margin-bottom: 10px;">
                        <strong>建议出发时间：</strong>
                        <span id="departureTime" style="color: #4285f4; font-weight: 600;">09:00</span>
                    </div>
                    <div>
                        <strong>预计出行时长：</strong>
                        <span id="travelDuration" style="color: #4285f4; font-weight: 600;">30</span> 分钟
                    </div>
                </div>
            </div>

            <!-- 路况预测 -->
            <div class="result-card traffic-section" id="trafficSection">
                <div class="section-title">🚦 路况预测</div>
                <div style="padding: 15px; background: #e7f3ff; border-radius: 6px;">
                    <div style="margin-bottom: 15px;">
                        <strong>当前路况：</strong>
                        <span id="currentTraffic" style="color: #2196F3; font-weight: 600;">畅通</span>
                    </div>
                    <div id="trafficContent"></div>
                </div>
            </div>

            <!-- 天气影响分析 -->
            <div class="result-card weather-section" id="weatherSection">
                <div class="section-title">🌤️ 天气影响分析</div>
                <div style="padding: 15px; background: #fff3cd; border-radius: 6px;">
                    <div style="margin-bottom: 15px;">
                        <strong>总体影响：</strong>
                        <span id="weatherImpact" style="color: #856404; font-weight: 600;">轻微</span>
                    </div>
                    <div style="margin-bottom: 15px;">
                        <strong>具体风险：</strong>
                        <div id="weatherRisks" style="margin-top: 10px;"></div>
                    </div>
                    <div>
                        <strong>应对措施：</strong>
                        <ul class="suggestion-list" id="weatherPrecautions"></ul>
                    </div>
                </div>
            </div>

            <!-- 出行建议 -->
            <div class="result-card">
                <div class="section-title">💡 出行建议</div>
                <ul class="suggestion-list" id="suggestionsList"></ul>
            </div>

            <!-- 置信度 -->
            <div class="result-card">
                <div class="section-title">📈 规划置信度</div>
                <div style="padding: 15px;">
                    <div style="margin-bottom: 10px; display: flex; justify-content: space-between;">
                        <span>AI规划模型置信度</span>
                        <span id="confidencePercent" style="font-weight: 600; color: #4285f4;">85%</span>
                    </div>
                    <div class="confidence-bar">
                        <div class="confidence-fill" id="confidenceFill" style="width: 85%;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 运输方式选择
        document.querySelectorAll('.transport-mode-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                this.classList.toggle('selected');
            });
        });

        // 获取选中的运输方式
        function getSelectedModes() {
            const selected = [];
            document.querySelectorAll('.transport-mode-btn.selected').forEach(btn => {
                selected.push(btn.dataset.mode);
            });
            return selected;
        }

        // 获取地点坐标
        function getLocationCoords() {
            const select = document.getElementById('location');
            const option = select.options[select.selectedIndex];
            return {
                lat: parseFloat(option.dataset.lat),
                lng: parseFloat(option.dataset.lng),
                city: option.dataset.city
            };
        }

        // 规划按钮点击事件
        document.getElementById('planBtn').addEventListener('click', async function() {
            const origin = document.getElementById('origin').value.trim();
            const destination = document.getElementById('destination').value.trim();
            const distance = document.getElementById('distance').value;
            const expectedDuration = document.getElementById('expected-duration').value;
            const preferredTime = document.getElementById('preferred-time').value;
            const coords = getLocationCoords();

            if (!origin || !destination || !coords.lat) {
                alert('请填写出发地、目的地和选择所在地点！');
                return;
            }

            if (!coords.city) {
                alert('请正确选择所在城市！');
                return;
            }

            // 禁用按钮并显示加载状态
            this.disabled = true;
            this.innerHTML = '<div class="spinner" style="width: 20px; height: 20px; border-width: 3px;"></div> 规划中...';

            try {
                // 构建请求
                const travelRequest = {
                    origin: origin,
                    destination: destination,
                    preferred_time: preferredTime || null,
                    preferred_modes: getSelectedModes(),
                    expected_duration: expectedDuration ? parseInt(expectedDuration) : null,
                    distance: distance ? parseFloat(distance) : null
                };

                // 调用API
                const response = await fetch(`/api/travel-planning?lat=${coords.lat}&lng=${coords.lng}&city=${coords.city}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(travelRequest)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                displayResults(data);
                document.getElementById('resultsContainer').style.display = 'block';
                document.getElementById('resultsContainer').scrollIntoView({ behavior: 'smooth' });

            } catch (error) {
                console.error('规划失败：', error);
                document.getElementById('errorMessage').textContent = '规划失败：' + error.message;
                document.getElementById('errorMessage').style.display = 'block';
                document.getElementById('resultsContainer').style.display = 'block';
            } finally {
                this.disabled = false;
                this.innerHTML = '🔍 规划出行方案';
            }
        });

        // 显示规划结果
        function displayResults(data) {
            // 显示主要推荐方案
            const modeIcons = {
                'subway': '🚇',
                'bus': '🚌',
                'driving': '🚗',
                'walking': '🚶',
                'cycling': '🚲'
            };

            const modeNames = {
                'subway': '地铁',
                'bus': '公交',
                'driving': '自驾',
                'walking': '步行',
                'cycling': '骑车'
            };

            const primaryMode = data.primary_mode;
            document.getElementById('primaryModeDisplay').textContent = modeNames[primaryMode] || primaryMode;
            document.getElementById('primaryModeDisplay').parentElement.parentElement.querySelector('.icon').textContent = modeIcons[primaryMode] || '🚗';

            // 出行方式评级
            const modesGrid = document.getElementById('modesGrid');
            modesGrid.innerHTML = '';
            data.modes_rating.forEach(mode => {
                const statusClass = `status-${mode.status.toLowerCase()}`;
                const statusText = {
                    'GO': '推荐',
                    'CAUTION': '谨慎',
                    'AVOID': '避免'
                }[mode.status] || mode.status;

                const isRecommended = mode.name === primaryMode ? 'recommended' : '';
                const modeIcon = modeIcons[mode.name] || '🚗';

                modesGrid.innerHTML += `
                    <div class="mode-card ${isRecommended}">
                        <div class="icon">${modeIcon}</div>
                        <div class="name">${modeNames[mode.name] || mode.name}</div>
                        <div class="status ${statusClass}">${statusText}</div>
                        <div class="reason">${mode.reason}</div>
                    </div>
                `;
            });

            // 推荐路线
            const routesList = document.getElementById('routesList');
            routesList.innerHTML = '';
            if (data.recommended_routes && data.recommended_routes.length > 0) {
                data.recommended_routes.forEach(route => {
                    const trafficColor = {
                        'smooth': '#4caf50',
                        'moderate': '#2196f3',
                        'congested': '#ff9800',
                        'severe': '#f44336'
                    }[route.traffic_level] || '#2196f3';

                    routesList.innerHTML += `
                        <div class="route-item">
                            <div class="route-name">${route.name}</div>
                            <div class="route-info">
                                <div class="route-info-item">⏱️ ${route.duration} 分钟</div>
                                <div class="route-info-item">📏 ${route.distance} 公里</div>
                                <div class="route-info-item" style="color: ${trafficColor};">🚦 ${route.traffic_level}</div>
                            </div>
                            <div class="route-description">${route.description}</div>
                        </div>
                    `;
                });
            }

            // 出发时间
            document.getElementById('departureTime').textContent = data.departure_time || '09:00';
            document.getElementById('travelDuration').textContent = data.travel_duration || '30';

            // 路况预测
            const trafficLevelText = {
                'smooth': '畅通',
                'moderate': '适中',
                'congested': '拥堵',
                'severe': '严重拥堵'
            }[data.traffic_prediction.current_level] || '适中';
            document.getElementById('currentTraffic').textContent = trafficLevelText;

            const trafficContent = document.getElementById('trafficContent');
            trafficContent.innerHTML = '';
            if (data.traffic_prediction.peak_hours && data.traffic_prediction.peak_hours.length > 0) {
                trafficContent.innerHTML += `<div><strong>拥堵高峰：</strong> ${data.traffic_prediction.peak_hours.join(', ')}</div>`;
            }
            if (data.traffic_prediction.recommendation) {
                trafficContent.innerHTML += `<div style="margin-top: 10px;"><strong>建议：</strong> ${data.traffic_prediction.recommendation}</div>`;
            }

            // 天气影响
            const weatherImpactText = {
                'minimal': '轻微',
                'moderate': '中等',
                'significant': '显著',
                'severe': '严重'
            }[data.weather_impact.overall_impact] || '中等';
            document.getElementById('weatherImpact').textContent = weatherImpactText;

            const risksDiv = document.getElementById('weatherRisks');
            risksDiv.innerHTML = '';
            if (data.weather_impact.specific_risks && data.weather_impact.specific_risks.length > 0) {
                data.weather_impact.specific_risks.forEach(risk => {
                    risksDiv.innerHTML += `<div class="risk-item">⚠️ ${risk}</div>`;
                });
            }

            const precautionsList = document.getElementById('weatherPrecautions');
            precautionsList.innerHTML = '';
            if (data.weather_impact.precautions && data.weather_impact.precautions.length > 0) {
                data.weather_impact.precautions.forEach(precaution => {
                    precautionsList.innerHTML += `<li>✓ ${precaution}</li>`;
                });
            }

            // 出行建议
            const suggestionsList = document.getElementById('suggestionsList');
            suggestionsList.innerHTML = '';
            if (data.suggestions && data.suggestions.length > 0) {
                data.suggestions.forEach(suggestion => {
                    suggestionsList.innerHTML += `<li>💡 ${suggestion}</li>`;
                });
            }

            // 置信度
            const confidence = Math.round((data.confidence_score || 0) * 100);
            document.getElementById('confidencePercent').textContent = confidence + '%';
            document.getElementById('confidenceFill').style.width = confidence + '%';
        }
    </script>
</body>
</html>
