<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>AI 智能助手 - GeoWeather</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body class="chat-page">
  <div class="topbar">
    <div class="brand">GeoWeather</div>
    <div style="margin-left: auto; display: flex; gap: 20px; align-items: flex-start;">
      <div style="display: flex; flex-direction: column; align-items: center;">
        <a href="/" style="color: white; text-decoration: none; padding: 8px 15px; background: rgba(255,255,255,0.2); border-radius: 4px; transition: background 0.3s; display: block; text-align: center;" onmouseover="this.style.background='rgba(255,255,255,0.3)'" onmouseout="this.style.background='rgba(255,255,255,0.2)'">🏠</a>
        <span style="color: #333; font-size: 11px; margin-top: 4px; white-space: nowrap; font-weight: 500;">地图</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center;">
        <a href="/travel-planning" style="color: white; text-decoration: none; padding: 8px 15px; background: rgba(255,255,255,0.2); border-radius: 4px; transition: background 0.3s; display: block; text-align: center;" onmouseover="this.style.background='rgba(255,255,255,0.3)'" onmouseout="this.style.background='rgba(255,255,255,0.2)'">🚗</a>
        <span style="color: #333; font-size: 11px; margin-top: 4px; white-space: nowrap; font-weight: 500;">出行规划</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center;">
        <a href="/alerts" style="color: white; text-decoration: none; padding: 8px 15px; background: rgba(255,255,255,0.2); border-radius: 4px; transition: background 0.3s; display: block; text-align: center;" onmouseover="this.style.background='rgba(255,255,255,0.3)'" onmouseout="this.style.background='rgba(255,255,255,0.2)'">🚨</a>
        <span style="color: #333; font-size: 11px; margin-top: 4px; white-space: nowrap; font-weight: 500;">预警中心</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center;">
        <a href="/ai-chat" style="color: white; text-decoration: none; padding: 8px 15px; background: rgba(255,255,255,0.4); border-radius: 4px; transition: background 0.3s; display: block; text-align: center;" onmouseover="this.style.background='rgba(255,255,255,0.5)'" onmouseout="this.style.background='rgba(255,255,255,0.4)'">🤖</a>
        <span style="color: #333; font-size: 11px; margin-top: 4px; white-space: nowrap; font-weight: 500;">AI助手</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center;">
        <a href="/profile" style="color: white; text-decoration: none; padding: 8px 15px; background: rgba(255,255,255,0.2); border-radius: 4px; transition: background 0.3s; display: block; text-align: center;" onmouseover="this.style.background='rgba(255,255,255,0.3)'" onmouseout="this.style.background='rgba(255,255,255,0.2)'">👤</a>
        <span style="color: #333; font-size: 11px; margin-top: 4px; white-space: nowrap; font-weight: 500;">个人中心</span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; border-left: 1px solid rgba(255,255,255,0.3); padding-left: 20px;">
        <div style="color: #fff; font-size: 13px; font-weight: 600; margin-bottom: 2px;">{{ user.username }}</div>
        <a href="/logout" style="color: #ff3b3b; font-size: 12px; text-decoration: none; font-weight: 600; cursor: pointer;" onmouseover="this.style.color='#ff0000'" onmouseout="this.style.color='#ff3b3b'">🚪 退出登录</a>
      </div>
    </div>
  </div>

  <div class="chat-page-content">
    <div class="chat-resizable-wrapper" id="chatResizableWrapper">
      <div class="chat-resize-hint" id="chatResizeHint" title="拖拽边缘或角落可调节窗口大小">⋮⋮</div>
      <div class="card chat-card chat-card-standalone">
        <div class="chat-layout">
          <aside class="chat-sidebar" id="chatSidebar">
            <div class="chat-sidebar-header">
              <span class="chat-sidebar-title">对话历史</span>
              <button type="button" class="chat-sidebar-toggle" id="chatSidebarToggle" title="收起" aria-label="收起">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
                <span>收起</span>
              </button>
            </div>
            <div class="chat-sidebar-list">
              <div class="chat-sidebar-item chat-sidebar-item-active" data-current="true">
                <div class="chat-sidebar-item-title">当前对话</div>
                <div class="chat-sidebar-item-time" id="chatSidebarCurrentTime">今天</div>
              </div>
            </div>
          </aside>
          <div class="chat-main">
            <div class="chat-main-header">
              <h2 class="chat-main-title">智能AI助手</h2>
              <p class="chat-main-subtitle" id="chatStatus">随时为您解答各种问题</p>
            </div>
            <div class="chat-messages" id="chatMessages">
              <div class="chat-message assistant">
                <span class="chat-msg-avatar chat-msg-avatar-ai">AI</span>
                <div class="chat-msg-body">
                  <div class="chat-bubble assistant">
                    您好！我是您的 AI 助手，有什么可以帮您的吗？<br><br>
                    我可以帮您：分析天气、出行建议、穿衣指南、分步出行规划等。您也可以回到地图页选个位置，我能提供更精准的天气分析！
                  </div>
                  <div class="chat-time">今天</div>
                </div>
              </div>
            </div>
            <div class="chat-input-area-modern">
              <div class="chat-input-bar">
                <input type="text" id="chatInput" class="chat-input-modern" placeholder="输入您的问题..." autocomplete="off" />
                <div class="chat-input-actions">
                  <button type="button" class="chat-attach-btn" title="项目"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg><span>项目</span></button>
                  <button type="button" class="chat-attach-btn" title="照片"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg><span>照片</span></button>
                  <button type="button" class="chat-attach-btn" title="文件"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg><span>文件</span></button>
                </div>
                <button id="chatSendBtn" class="chat-send-btn-purple" title="发送">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg>
                </button>
              </div>
              <div class="chat-quick-cards" id="chatQuickActions">
                <button type="button" class="quick-card quick-card-purple" data-msg="帮我用文字描述一下当前天气图景"><span class="quick-card-label">天气图景</span></button>
                <button type="button" class="quick-card quick-card-blue" data-msg="简单介绍一下当前天气情况"><span class="quick-card-label">了解天气</span></button>
                <button type="button" class="quick-card quick-card-teal" data-msg="今天穿什么衣服合适？"><span class="quick-card-label">穿衣建议</span></button>
                <button type="button" class="quick-card quick-card-amber" data-msg="给我今天的出行分步建议"><span class="quick-card-label">分步出行</span></button>
              </div>
            </div>
          </div>
        </div>
        <button class="chat-clear-btn-fab" id="chatClearBtn" title="清空对话" aria-label="清空对话">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/><path d="M10 11v6M14 11v6"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script src="/static/js/chat.js"></script>
</body>
</html>
